name: Auto Publish Drive Videos to Facebook Page

on:
  schedule:
    - cron: '37 */4 * * *' # প্রতি ৪ ঘণ্টা পরপর অটোমেটিক চলবে (6:37, 10:37, 2:37)
  workflow_dispatch:       # ম্যানুয়ালি টেস্ট করার জন্য Run বাটন চালু রাখবে

permissions:
  contents: write

concurrency:
  group: facebook-auto-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Facebook video uploader
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python upload.py

      - name: Save uploaded video history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add uploaded_videos.json
          git diff --staged --quiet || (git commit -m "Update Facebook uploaded videos log" && git pull --rebase origin HEAD && git push)
